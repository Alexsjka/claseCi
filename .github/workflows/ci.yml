name: validacion pagina

on:
  push:
    branches: ["main", "prueba"]
  pull_request:
    branches: ["main"]

jobs:
  validacion:
    name: crear una maquina virtual
    runs-on: ubuntu-24.04

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v7

      - name: instalar node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: validar codigo HTML
        run: |
          echo "inicio"
          npx html-validate "**/*.html"
          echo "fin"
